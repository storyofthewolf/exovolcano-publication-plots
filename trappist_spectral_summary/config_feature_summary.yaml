# Config for the spectral feature summary: ONE heatmap, signed ppm.
#
# Rebuilt 2026-09-06 after the two-panel version was rejected. What changed and
# why, so none of it gets reintroduced:
#
#   - ONE panel, not two. The signal/amplitude split forced the reader to
#     learn two colour scales with opposite polarity halfway across the
#     figure.
#   - PPM, not ratios. A ratio normalises each band to itself, so losing half
#     of a 4 ppm feature and half of a 45 ppm feature look identical. ppm is
#     what an instrument measures.
#   - NO HATCHING. 66 of 120 cells carried an overlap flag, which made half
#     the figure read as damaged and buried the numbers it was meant to
#     qualify. The overlap caveat belongs in the caption and in the band
#     selection, not painted over the data.
#   - DIVERGING about zero, so enhancement and muting are visibly different
#     kinds of event rather than two ends of one ramp.
#
# THE QUANTITY. Signed change in feature AMPLITUDE, in ppm:
#
#     amp(t) = peak-to-trough transit depth within the band at epoch t
#     value  = amp(t*) - amp(0)   at whichever t* gives the larger excursion
#
# Positive means the eruption deepened the feature, negative that the aerosol
# continuum flattened it. Measured range -37.8 to +66.6 ppm.
#
# Bands are the five defensible ones from exovolcano-spectra's
# feature_table_clean.py, with edges from measured species footprints. Gas
# overlap is why there are five and not eight, the same reason Fauchez et al.
# (2019) report a handful of named lines rather than every band.

# FIXED-WAVELENGTH band depths. Supersedes feature_table_clean.csv, whose
# amplitude was a max-minus-min over a window and therefore measured day 0 and
# day 2000 between different pairs of wavelengths. Here the core and both
# shoulders are constants, tabulated in band_depth_fixed.py, so a change in a
# cell is a change in the spectrum and not a change in where the code looked.
table_csv: /Users/wolfe/Desktop/projects/volcanos/exovolcano-spectra/data/band_depth_fixed.csv

# The cell COLOUR and its large number. amp_change is the change in
# peak-to-trough band amplitude; sig is the peak of the difference spectrum.
value_column: dD

# Second number printed under the first, for reconciliation against the
# manuscript's transmission figures (A5-A10). Those plot the DIFFERENCE
# spectrum, so a reader measuring ben1 tambora_100x's SO2 band off Figure A10
# by eye gets ~95 ppm, while this heatmap's amplitude change is +66. Both are
# right and they measure different things:
#
#   band max rises 4661.45 -> 4759.37   (+97.9 ppm)
#   band min rises 4655.74 -> 4689.08   (+33.3 ppm)
#   amplitude    5.72 ->   70.28        (+64.6 ppm)
#
# The core rises ~98 ppm, the wings ~33, and amplitude is the ~65 ppm
# separation between them. The difference metric counts the whole rise
# including the pedestal the band sits on.
#
# Set to null to print the amplitude change alone.
secondary_column: null
# secondary_label: unused while secondary_column is null.
secondary_label: "difference-spectrum peak"

atmospheres: [ben1, ben2, hab1, hab2]
atm_labels: {ben1: ben1, ben2: ben2, hab1: hab1, hab2: hab2}
rungs: [1, 10, 100]

bands:
  - {band: "SO2 7.3",  label: "SO$_2$ 7.3"}
  - {band: "SO2 8.7",  label: "SO$_2$ 8.7"}
  - {band: "H2O 6.3",  label: "H$_2$O 6.3"}
  - {band: "H2O 1.4",  label: "H$_2$O 1.4"}
  - {band: "CO2 4.3",  label: "CO$_2$ 4.3"}

figsize: [7.4, 9.0]

# Diverging about zero. PuOr is colourblind-safe and carries no good/bad
# reading: muting and enhancement are both physical outcomes. Symmetric +/-70
# covers the measured -37.8..+66.6 without letting one outlier set the scale.
cmap: PuOr_r
# Measured range -50.6 to +94.1 ppm.
vlim: 95.0
subtitle: "change in band depth at fixed wavelengths"
annotate: true
outfile: fig_feature_summary
