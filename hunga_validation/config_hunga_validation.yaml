# Config for hunga_validation figure: headline observational validation for
# the ExoCAM Hunga Tonga-Hunga Ha'apai (2022) case, analogous to
# pinatubo_validation/. Runs used here are the SECOND corrected set (residual
# 2x over-injection bug fixed in b2df9a1, rerun completed on HPC 2026-07-28/29,
# fetched 2026-07-29); the first "corrected" set used for the 2026-07-25 draft
# still had the residual bug and is superseded -- see CLAUDE.md session
# handoff and memory hunga-rerun-injection-fix.
#
# No global-mean quantitative target is plotted here: Khaykin et al. (2022)'s
# oft-quoted 0.047 +/- 0.011 dispersed SAOD value does NOT appear as stated
# text in that paper (verified against the full article) and has been
# dropped. The manuscript instead compares against Taha et al. (2022)'s
# qualitative claims and its own 30S-15N band, computed directly from this
# run's zonal CSV rather than plotted as a fixed reference line -- see
# main.tex sec:hungatonga. Do NOT reference the retired H2O-doubling target
# here either.
#
# Current on-disk layout: <base_dir>/<case_name>/data/<subpath>. Both phases
# are listed because the fiducial moved into the phase-2 suite (see below);
# the ensemble envelope is drawn from every case found under either root.
base_dirs:
  - /Users/wolfe/Desktop/projects/volcanos/remote_analysis/hunga
  - /Users/wolfe/Desktop/projects/volcanos/remote_analysis/hunga_phase2

# Fiducial case: highlighted line in panel (a) and the case shown in panel (b).
#
# CHANGED 2026-07-31, from exovolc_hunga_fid (0.5 Tg SO2, 0.5 um). The
# fiducial is now the case whose two inputs BOTH carry independent
# observational support: 1.0 Tg SO2, the explicit lower bound of Sellitto et
# al. (2024)'s IASI retrieval, and Reff = 0.4 um, the grown-aerosol size
# measured by SAGE III/ISS and CALIOP (0.35-0.45 um). Neither is inferred
# from an optical-depth budget, which is what distinguishes this from
# adopting the aerosol-derived sulfur masses of Legras et al. (2022). Its
# peak global-mean AOD of ~0.0138 is an OUTPUT of those two choices, not a
# target they were selected to hit -- see main.tex sec:hungatonga.
case: exovolc_hunga_r0.4_so2_1.0tg
# Legend label for the highlighted case. Kept here rather than hardcoded in
# the script, which is how the previous fiducial's label survived a change of
# fiducial and briefly mislabelled the figure.
case_label: 'Fiducial (1.0 Tg SO$_2$, $R_{\mathrm{eff}} = 0.4~\mu$m)'
# Glob (relative to each base_dir) matching every case whose global-mean time
# series is drawn faintly behind the fiducial in panel (a), to show the full
# sweep sensitivity envelope (28 cases across both phases).
case_glob: exovolc_hunga_*

subpath_timeseries: aod/aod_550nm_band.csv
subpath_zonal: aod/aod_zonal_550nm_band.csv

outfile_stem: fig_hunga_validation

# t=0 (days_since_start = 0) maps to this calendar date.
eruption_date: 2022-01-15
# Calendar x-axis range [start, end]; major ticks each year, minor each month.
xlim: [2022-01-01, 2024-01-01]

# No published Hunga Tonga sAOD retrieval reports a single global-mean or
# fixed comparable number (see main.tex sec:hungatonga), so panel (a) plots
# no horizontal reference line/band. Left empty deliberately -- do not
# reintroduce the retired Khaykin 0.047 figure-reading value here.
references: []
